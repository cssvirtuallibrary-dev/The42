<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Hoa Nghiêm Thủ Nhãn</title>

  <!-- Google Fonts: Siddham & Vietnamese support -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Siddham&family=Noto+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0c0d12;
      --card-bg: #161822;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-purple: #ce93d8;
      --text-gold: #ffecb3;
      --text-gold-subtle: #ffe082;
      --text-green: #81c784;
      --text-light-green: #c8e6c9;
      --text-peach: #ffccbc;
      --text-muted: #90a4ae;
      --yt-red: #e50914;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: #eceff1;
      font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding-bottom: 50px;
    }

    /* Sticky Mobile Control Header */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(12, 13, 18, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 10px 14px;
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    .header-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .app-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-gold);
      letter-spacing: 0.3px;
    }

    .counter-pill {
      font-size: 0.8rem;
      background: rgba(255, 236, 179, 0.15);
      color: var(--text-gold);
      border: 1px solid rgba(255, 236, 179, 0.25);
      padding: 3px 9px;
      border-radius: 12px;
      font-weight: 700;
      white-space: nowrap;
    }

    .controls-grid {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .custom-select, .search-box {
      width: 100%;
      background: #1f2230;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.92rem;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .custom-select:focus, .search-box:focus {
      border-color: var(--text-gold);
    }

    .search-box::placeholder {
      color: #78909c;
    }

    /* Content Area */
    main {
      max-width: 520px;
      margin: 0 auto;
      padding: 12px 10px;
    }

    .status-box {
      text-align: center;
      padding: 60px 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(206, 147, 216, 0.2);
      border-top-color: var(--text-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* Card Styling */
    .card {
      background: var(--card-bg);
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 4px 18px rgba(0, 0, 0, 0.35);
      padding: 16px 14px;
      margin-bottom: 20px;
      position: relative;
    }

    /* Top Metadata Pill Row */
    .card-top-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .wbsid-pill {
      font-size: 0.78rem;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 8px;
      border-radius: 6px;
      font-family: monospace;
      font-weight: 600;
    }

    .stt-pill {
      font-size: 0.82rem;
      background: rgba(255, 236, 179, 0.12);
      color: var(--text-gold);
      border: 1px solid rgba(255, 236, 179, 0.3);
      padding: 2px 10px;
      border-radius: 12px;
      font-weight: 700;
    }

    /* Top: A2 Lý */
    .top-ly {
      font-style: italic;
      color: #a5d6a7;
      text-align: center;
      font-size: clamp(0.9rem, 3.4vw, 1.05rem);
      line-height: 1.4;
      margin: 4px 0 10px 0;
      padding: 0 4px;
    }

    /* Title: Thủ Nhãn + CTT + Siddham */
    .card-label {
      color: var(--text-purple);
      text-align: center;
      font-size: clamp(1.3rem, 5vw, 1.7rem);
      font-weight: 700;
      line-height: 1.3;
      margin: 6px 0 4px 0;
      word-break: break-word;
    }

    .separator {
      color: #b0bec5;
      margin: 0 3px;
      font-weight: 300;
    }

    .siddham {
      font-family: "Noto Sans Siddham", serif;
      font-weight: 400;
      font-size: 1.15em;
      margin-left: 6px;
      color: #e1bee7;
      display: inline-block;
    }

    /* Dharma Object Name */
    .name {
      color: #eceff1;
      text-align: center;
      font-weight: 600;
      font-size: clamp(0.95rem, 3.5vw, 1.1rem);
      margin: 4px 0 10px 0;
      opacity: 0.9;
    }

    /* CTT Dài */
    .CTT-dai {
      color: var(--text-gold);
      text-align: center;
      font-weight: 700;
      font-size: clamp(1.05rem, 4vw, 1.25rem);
      line-height: 1.35;
      margin: 8px 0 4px 0;
    }

    /* Giảng Giải CTT */
    .chu-thich {
      color: var(--text-green);
      text-align: center;
      font-weight: 400;
      font-size: clamp(0.9rem, 3.2vw, 1.05rem);
      line-height: 1.45;
      margin: 6px 4px 12px 4px;
    }

    /* Side-by-side Images */
    .image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      margin: 12px 0 14px 0;
      width: 100%;
    }

    .card-img {
      max-width: 48%;
      height: auto;
      max-height: 165px;
      object-fit: contain;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Khai Dẫn */
    .chi-dan {
      color: var(--text-peach);
      text-align: center;
      font-weight: 500;
      font-size: clamp(1.02rem, 3.8vw, 1.25rem);
      line-height: 1.4;
      margin: 10px 4px;
    }

    /* Hành Header */
    .chu-header {
      color: var(--text-gold-subtle);
      text-align: center;
      font-weight: 700;
      font-size: clamp(1.1rem, 4.2vw, 1.35rem);
      margin: 12px 0 6px 0;
    }

    /* Hành A & Hành B */
    .data-container {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 6px 0 14px 0;
    }

    .chu-col {
      flex: 1;
      color: var(--text-gold);
      text-align: center;
      font-weight: 600;
      font-size: clamp(0.92rem, 3.5vw, 1.1rem);
      line-height: 1.3;
      background: rgba(255, 236, 179, 0.05);
      padding: 10px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 236, 179, 0.12);
      word-break: break-word;
    }

    /* YouTube Button */
    .button-container {
      display: flex;
      justify-content: center;
      margin: 16px 0 14px 0;
    }

    .youtube-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background-color: var(--yt-red);
      color: #ffffff !important;
      padding: 10px 22px;
      font-size: clamp(0.9rem, 3.5vw, 1.05rem);
      font-weight: 700;
      text-decoration: none;
      border-radius: 24px;
      box-shadow: 0 4px 12px rgba(229, 9, 20, 0.35);
      min-height: 44px;
    }

    .youtube-btn:active {
      transform: scale(0.97);
    }

    /* Post-Audio Order */
    .trung-dan {
      color: var(--text-peach);
      text-align: center;
      font-size: clamp(0.95rem, 3.6vw, 1.15rem);
      line-height: 1.4;
      margin: 12px 4px 6px 4px;
    }

    .chu-KD {
      color: #ffab91;
      text-align: center;
      font-weight: 600;
      font-size: clamp(1.05rem, 4vw, 1.3rem);
      line-height: 1.35;
      margin: 10px 0 6px 0;
    }

    .KD {
      color: var(--text-light-green);
      text-align: center;
      font-weight: 700;
      font-size: clamp(1.1rem, 4.2vw, 1.35rem);
      line-height: 1.35;
      margin: 10px 0 6px 0;
    }

    .ket-dan {
      color: var(--text-gold);
      text-align: center;
      font-weight: 500;
      font-size: clamp(0.95rem, 3.6vw, 1.15rem);
      line-height: 1.4;
      margin: 10px 4px 4px 4px;
    }
  </style>
</head>
<body>

  <!-- Sticky Header -->
  <header>
    <div class="header-bar">
      <span class="app-title">Hoa Nghiêm Thủ Nhãn</span>
      <span class="counter-pill" id="counterPill">0 / 0</span>
    </div>
    <div class="controls-grid">
      <select id="sttSelect" class="custom-select" onchange="handleFilterSort()">
        <option value="">Đang tải danh sách bộ lọc...</option>
      </select>
      <input 
        type="search" 
        id="searchInput" 
        class="search-box" 
        placeholder="🔍 Tìm kiếm theo tên, chú, pháp bảo..." 
        oninput="handleFilterSort()"
      />
    </div>
  </header>

  <!-- Main Feed -->
  <main id="app">
    <div class="status-box" id="statusBox">
      <div class="spinner"></div>
      Đang kết nối Google Sheet...
    </div>
  </main>

  <script>
    const SHEET_ID = '1Gvl7SNXhVSrKBJiPgt78T2opWckb5OO59S-q_4S6Y7w';
    const TAB_NAME = 'WBSID';
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(TAB_NAME)}`;

    let allRows = [];
    let headers = [];
    let filterOptions = []; // Array of { key: string, label: string, count: number }

    // Google Drive direct image URL helper
    function getDriveDirectImageUrl(urlOrId) {
      if (!urlOrId) return '';
      const str = String(urlOrId).trim();
      if (!str) return '';

      if (/^[a-zA-Z0-9_-]{25,}$/.test(str)) {
        return `https://drive.google.com/thumbnail?id=${str}&sz=w800`;
      }

      const idMatch = str.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) ||
                      str.match(/id=([a-zA-Z0-9_-]+)/) ||
                      str.match(/\/open\?id=([a-zA-Z0-9_-]+)/) ||
                      str.match(/\/uc\?id=([a-zA-Z0-9_-]+)/);

      if (idMatch && idMatch[1]) {
        return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w800`;
      }
      return str;
    }

    // Natural alphanumeric compare (e.g. E01 < E02 < E10)
    function naturalCompare(a, b) {
      return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
    }

    // Safe field accessor
    function getField(row, ...keys) {
      for (const k of keys) {
        if (row[k] !== undefined && row[k] !== null && String(row[k]).trim() !== '') {
          return String(row[k]).trim();
        }
      }
      return '';
    }

    async function initSheetData() {
      try {
        const res = await fetch(GVIZ_URL);
        const text = await res.text();
        const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const json = JSON.parse(jsonString);

        if (!json.table || !json.table.rows) {
          throw new Error('Không có dữ liệu trong bảng.');
        }

        // 1. Determine column headers reliably
        let colLabels = (json.table.cols || []).map(c => (c && c.label ? c.label.trim() : ''));
        
        let startRowIdx = 0;
        // If col labels are missing from table.cols, check first row
        const hasMissingLabels = colLabels.filter(Boolean).length < 5;
        if (hasMissingLabels && json.table.rows.length > 0) {
          const firstRow = json.table.rows[0].c || [];
          const candidateLabels = firstRow.map(cell => (cell && (cell.f || cell.v) ? String(cell.f || cell.v).trim() : ''));
          
          if (candidateLabels.some(l => l.toUpperCase().includes('WBSID') || l.toUpperCase().includes('STT'))) {
            colLabels = candidateLabels;
            startRowIdx = 1; // Row 0 was the header
          }
        }

        // Fill any remaining blank header with col index (col_12 for M, col_13 for N, etc.)
        headers = colLabels.map((lbl, idx) => lbl || `col_${idx}`);

        // 2. Parse data rows
        allRows = [];
        for (let r = startRowIdx; r < json.table.rows.length; r++) {
          const rowObj = {};
          const cells = json.table.rows[r].c || [];
          cells.forEach((cell, idx) => {
            const h = headers[idx] || `col_${idx}`;
            const val = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : (cell.v !== null && cell.v !== undefined ? cell.v : '')) : '';
            rowObj[h] = val;
            rowObj[`idx_${idx}`] = val; // Also index by position for columns M (12) to Y (24)
          });

          // Only keep rows that have meaningful content
          const hasContent = Object.values(rowObj).some(v => String(v).trim() !== '');
          if (hasContent) {
            allRows.push(rowObj);
          }
        }

        // 3. Scan & build STT filter list
        discoverFilters();
        buildDropdown();
        handleFilterSort();

      } catch (err) {
        console.error(err);
        document.getElementById('statusBox').innerHTML = `
          <p style="color:#ef5350; font-weight:700;">Không thể tải dữ liệu</p>
          <p style="font-size:0.85rem; margin-top:8px;">Vui lòng kiểm tra quyền chia sẻ công khai của file Google Sheet.</p>
        `;
      }
    }

    function discoverFilters() {
      filterOptions = [];
      const foundKeys = new Set();

      // Strategy A: Header name contains 'STT'
      headers.forEach((h, idx) => {
        if (/STT/i.test(h) && !foundKeys.has(h)) {
          const count = allRows.filter(r => String(r[h] || '').trim() !== '').length;
          if (count > 0) {
            foundKeys.add(h);
            filterOptions.push({ key: h, label: h, count: count });
          }
        }
      });

      // Strategy B: Guarantee columns M to Y (indices 12 to 24) are scanned
      for (let i = 12; i <= 24; i++) {
        const headerName = headers[i];
        const idxKey = `idx_${i}`;
        const keyToUse = (headerName && !headerName.startsWith('col_')) ? headerName : idxKey;

        if (!foundKeys.has(keyToUse)) {
          const count = allRows.filter(r => String(r[keyToUse] || '').trim() !== '').length;
          if (count > 0) {
            foundKeys.add(keyToUse);
            const colLetter = String.fromCharCode(65 + i);
            const label = headerName && !headerName.startsWith('col_') ? headerName : `STT-${colLetter} (Cột ${colLetter})`;
            filterOptions.push({ key: keyToUse, label: label, count: count });
          }
        }
      }
    }

    function buildDropdown() {
      const select = document.getElementById('sttSelect');
      select.innerHTML = '';

      // Default option
      const allOpt = document.createElement('option');
      allOpt.value = '__ALL__';
      allOpt.textContent = `📋 Xem tất cả (${allRows.length} thẻ)`;
      select.appendChild(allOpt);

      filterOptions.forEach(optData => {
        const opt = document.createElement('option');
        opt.value = optData.key;
        opt.textContent = `🎯 ${optData.label} (${optData.count} thẻ)`;
        select.appendChild(opt);
      });

      // Default to the first STT filter
      if (filterOptions.length > 0) {
        select.value = filterOptions[0].key;
      }
    }

    function handleFilterSort() {
      const selectedKey = document.getElementById('sttSelect').value || '__ALL__';
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
      const app = document.getElementById('app');

      let list = [];

      if (selectedKey === '__ALL__') {
        list = [...allRows];
      } else {
        list = allRows
          .filter(r => {
            const v = r[selectedKey];
            return v !== undefined && v !== null && String(v).trim() !== '';
          })
          .sort((a, b) => naturalCompare(a[selectedKey], b[selectedKey]));
      }

      if (searchVal) {
        list = list.filter(r => {
          const combined = Object.values(r).join(' ').toLowerCase();
          return combined.includes(searchVal);
        });
      }

      document.getElementById('counterPill').textContent = `${list.length} / ${allRows.length}`;

      if (list.length === 0) {
        app.innerHTML = `<div class="status-box">Không tìm thấy thẻ nào phù hợp.</div>`;
        return;
      }

      app.innerHTML = list.map(row => {
        const sttVal = selectedKey !== '__ALL__' ? row[selectedKey] : '';
        const wbsid = getField(row, 'WBSID', 'Mã WBSID', 'Title (WBSID)', 'idx_0');
        const a2Ly = getField(row, 'A2 Lý', 'Lý', 'idx_6');
        const c5Name = getField(row, 'C5 Thủ Nhãn-Tên', 'C5 Tên Thủ Nhãn', 'C5 Thủ Nhãn', 'C5', 'idx_1');
        const c1 = getField(row, 'C1 Tên CTT', 'C1 CTT', 'C1', 'idx_2');
        const c4 = getField(row, 'C4 Siddham Unicode', 'C4 Siddham', 'C4', 'idx_5');
        const dharma = getField(row, 'C5 Dharma Object Name', 'Dharma Object Name');
        const c2 = getField(row, 'C2 Tên Dài CTT', 'C2 Dài CTT', 'C2', 'idx_3');
        const c3 = getField(row, 'C3 Giảng Giải CTT', 'C3 Giảng Giải', 'C3', 'idx_4');

        const imgCTT = getDriveDirectImageUrl(getField(row, 'C4 CTT Link', 'CTT Link', 'CTT-Link'));
        const imgPhapBao = getDriveDirectImageUrl(getField(row, 'C5 Pháp Bảo Link', 'Pháp Bảo Link', 'Phap Bao Link'));

        const a3KhaiDan = getField(row, 'A3 Khai Dẫn', 'Khai Dẫn', 'idx_7');
        const a4Hanh = getField(row, 'A4 Hành', 'Hành', 'idx_8');
        const a4HanhA = getField(row, 'A4 Hành A', 'Hành A', 'idx_9');
        const a4HanhB = getField(row, 'A4 Hành B', 'Hành B', 'idx_10');
        const d1Voice = getField(row, 'D1 Van Voice', 'D1 Voice', 'D1', 'idx_11');

        const a5TrungDan = getField(row, 'A5 Trung Dẫn', 'Trung Dẫn');
        const a6ChuKD = getField(row, 'A6 Chú Khởi Động', 'Chú Khởi Động');
        const a8LoiKD = getField(row, 'A8 Lời Khẳng Định', 'Lời Khẳng Định');
        const a9KetDan = getField(row, 'A9 Kết Dẫn', 'Kết Dẫn');

        return `
          <div class="card">
            
            <!-- Top Row: WBSID & STT badge -->
            <div class="card-top-row">
              ${wbsid ? `<span class="wbsid-pill">${wbsid}</span>` : `<span></span>`}
              ${sttVal ? `<span class="stt-pill">${sttVal}</span>` : ''}
            </div>

            <!-- Top: A2 Lý -->
            ${a2Ly ? `<p class="top-ly">${a2Ly}</p>` : ''}

            <!-- Label: Thủ Nhãn + CTT + Siddham -->
            <p class="card-label">
              <span class="tên">${c5Name}</span>
              ${c1 ? `<span class="separator">–</span><span class="CTT">${c1}</span>` : ''}
              ${c4 ? `<span class="siddham">${c4}</span>` : ''}
            </p>

            <!-- Dharma Object Name -->
            ${dharma ? `<p class="name">${dharma}</p>` : ''}

            <!-- CTT Dài -->
            ${c2 ? `<p class="CTT-dai">${c2}</p>` : ''}

            <!-- Giảng Giải CTT -->
            ${c3 ? `<p class="chu-thich">${c3}</p>` : ''}

            <!-- Google Drive Images -->
            ${(imgCTT || imgPhapBao) ? `
              <div class="image-container">
                ${imgCTT ? `<img src="${imgCTT}" class="card-img" alt="CTT" loading="lazy" onerror="this.style.display='none'"/>` : ''}
                ${imgPhapBao ? `<img src="${imgPhapBao}" class="card-img" alt="Pháp Bảo" loading="lazy" onerror="this.style.display='none'"/>` : ''}
              </div>
            ` : ''}

            <!-- Khai Dẫn -->
            ${a3KhaiDan ? `<p class="chi-dan">${a3KhaiDan}</p>` : ''}

            <!-- Hành Header -->
            ${a4Hanh ? `<h5 class="chu-header">${a4Hanh}</h5>` : ''}

            <!-- Hành A & B -->
            ${(a4HanhA || a4HanhB) ? `
              <div class="data-container">
                ${a4HanhA ? `<div class="chu-col">${a4HanhA}</div>` : ''}
                ${a4HanhB ? `<div class="chu-col">${a4HanhB}</div>` : ''}
              </div>
            ` : ''}

            <!-- YouTube Voice Button -->
            ${d1Voice ? `
              <div class="button-container">
                <a href="${d1Voice}" target="_blank" rel="noopener noreferrer" class="youtube-btn">
                  <span>▶</span> Nghe trên YouTube
                </a>
              </div>
            ` : ''}

            <!-- Post-Audio Order: A5 -> A6 -> A8 -> A9 -->
            ${a5TrungDan ? `<p class="trung-dan">${a5TrungDan}</p>` : ''}
            ${a6ChuKD ? `<p class="chu-KD">${a6ChuKD}</p>` : ''}
            ${a8LoiKD ? `<p class="KD">${a8LoiKD}</p>` : ''}
            ${a9KetDan ? `<p class="ket-dan">${a9KetDan}</p>` : ''}

          </div>
        `;
      }).join('');
    }

    window.addEventListener('DOMContentLoaded', initSheetData);
  </script>
</body>
</html>
