<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hoa Nghiêm Thủ Nhãn</title>

  <!-- Google Fonts: Siddham & Vietnamese support -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Siddham&family=Noto+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-color: #0b0c10;
      --card-bg: #151722;
      --card-border: rgba(255, 255, 255, 0.08);
      --text-purple: #ce93d8;
      --text-gold: #ffecb3;
      --text-gold-bright: #ffe082;
      --text-green: #81c784;
      --text-light-green: #c8e6c9;
      --text-peach-soft: #ffccbc;
      --text-orange-bold: #ffab91;
      --text-muted: #90a4ae;
      --player-bg: #1f2230;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-color);
      color: #eceff1;
      font-family: 'Noto Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding-bottom: 60px;
    }

    /* ==========================================================
       STICKY RESPONSIVE HEADER
       ========================================================== */
    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 12, 16, 0.96);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 12px 18px;
      border-bottom: 1px solid var(--card-border);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .header-container {
      max-width: 1400px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-gold);
      letter-spacing: 0.4px;
    }

    .counter-pill {
      font-size: 0.85rem;
      background: rgba(255, 236, 179, 0.15);
      color: var(--text-gold);
      border: 1px solid rgba(255, 236, 179, 0.28);
      padding: 4px 12px;
      border-radius: 14px;
      font-weight: 700;
      white-space: nowrap;
    }

    .controls-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    /* On Landscape & Desktop, split controls horizontally */
    @media (min-width: 680px) {
      .header-container {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }
      .controls-grid {
        grid-template-columns: 1.2fr 1fr;
        flex: 1;
        max-width: 750px;
        margin-left: 20px;
      }
    }

    .custom-select, .search-box {
      width: 100%;
      background: #1e202c;
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 14px;
      font-size: 0.95rem;
      outline: none;
      transition: all 0.2s ease;
    }

    .custom-select:focus, .search-box:focus {
      border-color: var(--text-gold);
      box-shadow: 0 0 0 2px rgba(255, 236, 179, 0.2);
    }

    .search-box::placeholder {
      color: #78909c;
    }

    /* ==========================================================
       RESPONSIVE CARD GRID LAYOUT
       ========================================================== */
    main {
      width: 100%;
      max-width: 1440px;
      margin: 0 auto;
      padding: 16px 12px;
    }

    #cardsGrid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
      align-items: start;
    }

    /* Landscape phones & small tablets: 2 columns */
    @media (min-width: 680px) {
      #cardsGrid {
        grid-template-columns: repeat(2, 1fr);
        gap: 22px;
      }
      main {
        padding: 20px 16px;
      }
    }

    /* Desktop & large screens: 3 columns */
    @media (min-width: 1120px) {
      #cardsGrid {
        grid-template-columns: repeat(3, 1fr);
        gap: 24px;
      }
    }

    .status-box {
      grid-column: 1 / -1;
      text-align: center;
      padding: 70px 16px;
      color: var(--text-muted);
      font-size: 1rem;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(206, 147, 216, 0.2);
      border-top-color: var(--text-purple);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px auto;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* ==========================================================
       CARD STYLING
       ========================================================== */
    .card {
      background: var(--card-bg);
      border-radius: 18px;
      border: 1px solid var(--card-border);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4);
      padding: 16px 16px 20px 16px;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    @media (hover: hover) {
      .card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.55);
        border-color: rgba(255, 236, 179, 0.25);
      }
    }

    /* Full-Width Centered Top Pill */
    .full-width-pill {
      display: block;
      width: 100%;
      text-align: center;
      font-size: clamp(0.85rem, 2vw, 0.98rem);
      color: var(--text-gold);
      background: rgba(255, 236, 179, 0.10);
      border: 1px solid rgba(255, 236, 179, 0.26);
      padding: 7px 14px;
      border-radius: 24px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 8px;
      word-break: break-word;
    }

    /* Top: A2 Lý (Under Pill) */
    .top-ly {
      font-style: italic;
      color: #a5d6a7;
      text-align: center;
      font-size: clamp(0.84rem, 1.8vw, 0.94rem);
      line-height: 1.45;
      margin: 4px 0 10px 0;
      padding: 0 6px;
      opacity: 0.95;
    }

    /* Main Heading: C5 Thủ Nhãn – C1 CTT + C4 Siddham */
    .card-label {
      color: var(--text-purple);
      text-align: center;
      font-size: clamp(1.25rem, 3.2vw, 1.65rem);
      font-weight: 700;
      line-height: 1.3;
      margin: 4px 0 4px 0;
      word-break: break-word;
    }

    .separator {
      color: #b0bec5;
      margin: 0 4px;
      font-weight: 300;
    }

    .siddham {
      font-family: "Noto Sans Siddham", serif;
      font-weight: 400;
      font-size: 1.15em;
      margin-left: 6px;
      color: #e1bee7;
      display: inline-block;
    }

    /* Dharma Object Name */
    .name {
      color: #eceff1;
      text-align: center;
      font-weight: 600;
      font-size: clamp(0.92rem, 2vw, 1.05rem);
      margin: 4px 0 8px 0;
      opacity: 0.9;
    }

    /* CTT Dài */
    .CTT-dai {
      color: var(--text-gold);
      text-align: center;
      font-weight: 700;
      font-size: clamp(1rem, 2.2vw, 1.18rem);
      line-height: 1.35;
      margin: 6px 0 4px 0;
    }

    /* Giảng Giải CTT */
    .chu-thich {
      color: var(--text-green);
      text-align: center;
      font-weight: 400;
      font-size: clamp(0.88rem, 1.8vw, 1rem);
      line-height: 1.45;
      margin: 6px 4px 12px 4px;
    }

    /* Responsive Dual Images */
    .image-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 12px 0 16px 0;
      width: 100%;
    }

    .card-img {
      max-width: 48%;
      height: auto;
      max-height: 180px;
      object-fit: contain;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.03);
      padding: 5px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    /* Lesser Emphasis: A3 Khai Dẫn, A5 Trung Dẫn, A9 Kết Dẫn */
    .lesser-dan {
      color: var(--text-peach-soft);
      text-align: center;
      font-weight: 400;
      font-style: italic;
      font-size: clamp(0.88rem, 1.8vw, 1.02rem);
      line-height: 1.45;
      margin: 10px 4px;
      padding: 0 4px;
      opacity: 0.92;
    }

    /* High Emphasis: A4 Hành Header */
    .chu-header {
      color: var(--text-gold-bright);
      text-align: center;
      font-weight: 800;
      font-size: clamp(1.1rem, 2.4vw, 1.35rem);
      margin: 14px 0 8px 0;
      letter-spacing: 0.3px;
    }

    /* High Emphasis: A4 Hành A & B */
    .data-container {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin: 8px 0 14px 0;
    }

    .chu-col {
      flex: 1;
      color: #fff3d0;
      text-align: center;
      font-weight: 700;
      font-size: clamp(0.92rem, 2vw, 1.1rem);
      line-height: 1.35;
      background: rgba(255, 236, 179, 0.08);
      padding: 10px 8px;
      border-radius: 10px;
      border: 1.5px solid rgba(255, 236, 179, 0.22);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      word-break: break-word;
    }

    /* ==========================================================
       AUDIO PLAYER STYLING
       ========================================================== */
    .audio-wrapper {
      margin: 14px 0 12px 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .audio-player {
      width: 100%;
      height: 40px;
      border-radius: 20px;
      outline: none;
      filter: invert(0.9) hue-rotate(180deg); /* Blends default HTML audio player into dark theme */
    }

    /* High Emphasis: A6 Chú Khởi Động */
    .chu-KD-bold {
      color: var(--text-orange-bold);
      text-align: center;
      font-weight: 800;
      font-size: clamp(1.08rem, 2.4vw, 1.32rem);
      line-height: 1.35;
      margin: 14px 0 8px 0;
      padding: 8px 10px;
      background: rgba(255, 171, 145, 0.08);
      border-radius: 8px;
      border: 1px solid rgba(255, 171, 145, 0.22);
      word-break: break-word;
    }

    /* High Emphasis: A8 Lời Khẳng Định */
    .KD-bold {
      color: var(--text-light-green);
      text-align: center;
      font-weight: 800;
      font-size: clamp(1.1rem, 2.4vw, 1.35rem);
      line-height: 1.35;
      margin: 10px 0 10px 0;
      padding: 8px 10px;
      background: rgba(200, 230, 201, 0.08);
      border-radius: 8px;
      border: 1px solid rgba(200, 230, 201, 0.22);
      word-break: break-word;
    }
  </style>
</head>
<body>

  <!-- Sticky Header Controls -->
  <header>
    <div class="header-container">
      <div class="header-top">
        <span class="app-title">Hoa Nghiêm Thủ Nhãn</span>
        <span class="counter-pill" id="counterPill">0 / 0</span>
      </div>
      <div class="controls-grid">
        <select id="sttSelect" class="custom-select" onchange="handleFilterSort()">
          <option value="">Đang tải tất cả bộ lọc...</option>
        </select>
        <input 
          type="search" 
          id="searchInput" 
          class="search-box" 
          placeholder="🔍 Tìm theo tên, chú, pháp bảo..." 
          oninput="handleFilterSort()"
        />
      </div>
    </div>
  </header>

  <!-- Main Feed Grid -->
  <main>
    <div id="cardsGrid">
      <div class="status-box" id="statusBox">
        <div class="spinner"></div>
        Đang kết nối dữ liệu Google Sheet...
      </div>
    </div>
  </main>

  <script>
    const SHEET_ID = '1Gvl7SNXhVSrKBJiPgt78T2opWckb5OO59S-q_4S6Y7w';
    const TAB_NAME = 'WBSID';
    const GVIZ_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&sheet=${encodeURIComponent(TAB_NAME)}`;

    let allRows = [];
    let filterOptions = [];

    // Helper: Convert Google Drive URLs/IDs to direct image thumbnails
    function getDriveDirectImageUrl(urlOrId) {
      if (!urlOrId) return '';
      const str = String(urlOrId).trim();
      if (!str || str.startsWith('#') || str.length < 5) return '';

      if (/^[a-zA-Z0-9_-]{25,}$/.test(str)) {
        return `https://drive.google.com/thumbnail?id=${str}&sz=w800`;
      }

      const idMatch = str.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) ||
                      str.match(/id=([a-zA-Z0-9_-]+)/) ||
                      str.match(/\/open\?id=([a-zA-Z0-9_-]+)/) ||
                      str.match(/\/uc\?id=([a-zA-Z0-9_-]+)/);

      if (idMatch && idMatch[1]) {
        return `https://drive.google.com/thumbnail?id=${idMatch[1]}&sz=w800`;
      }

      if (str.startsWith('http://') || str.startsWith('https://')) {
        return str;
      }
      return '';
    }

    // Helper: Convert Google Drive Audio Link into direct streaming audio source
    function getDriveDirectAudioUrl(urlOrId) {
      if (!urlOrId) return '';
      const str = String(urlOrId).trim();
      if (!str || str.length < 5) return '';

      // Extract Drive File ID
      if (/^[a-zA-Z0-9_-]{25,}$/.test(str)) {
        return `https://docs.google.com/uc?export=open&id=${str}`;
      }

      const idMatch = str.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) ||
                      str.match(/id=([a-zA-Z0-9_-]+)/) ||
                      str.match(/\/open\?id=([a-zA-Z0-9_-]+)/) ||
                      str.match(/\/uc\?id=([a-zA-Z0-9_-]+)/);

      if (idMatch && idMatch[1]) {
        return `https://docs.google.com/uc?export=open&id=${idMatch[1]}`;
      }

      // Standard MP3 / audio web link fallback
      if (str.startsWith('http://') || str.startsWith('https://')) {
        return str;
      }
      return '';
    }

    function naturalCompare(a, b) {
      return String(a).localeCompare(String(b), undefined, { numeric: true, sensitivity: 'base' });
    }

    function cleanText(val) {
      if (val === undefined || val === null) return '';
      const s = String(val).trim();
      if (s === '' || s === '0' || s === 'null' || s === 'undefined') return '';
      return s;
    }

    // Match column content by pattern
    function findValue(row, pattern) {
      for (const [k, v] of Object.entries(row)) {
        if (pattern.test(k)) {
          const cleaned = cleanText(v);
          if (cleaned) return cleaned;
        }
      }
      return '';
    }

    // 1. Fetch live sheet data
    async function initSheetData() {
      try {
        const res = await fetch(GVIZ_URL);
        const text = await res.text();
        const jsonString = text.substring(text.indexOf('{'), text.lastIndexOf('}') + 1);
        const json = JSON.parse(jsonString);

        if (!json.table || !json.table.rows) {
          throw new Error('Không có dữ liệu trong bảng.');
        }

        let colHeaders = (json.table.cols || []).map(c => (c && c.label ? c.label.trim() : ''));
        let startRow = 0;

        if (json.table.rows.length > 0) {
          const row0Cells = json.table.rows[0].c || [];
          const candidateLabels = row0Cells.map(c => c && (c.f || c.v) ? String(c.f || c.v).trim() : '');
          if (candidateLabels.some(lbl => /WBSID|Thủ Nhãn|STT/i.test(lbl))) {
            colHeaders = candidateLabels;
            startRow = 1;
          }
        }

        colHeaders = colHeaders.map((h, i) => h || `COL_${i}`);

        // Parse rows
        allRows = [];
        for (let r = startRow; r < json.table.rows.length; r++) {
          const rowObj = {};
          const cells = json.table.rows[r].c || [];
          
          cells.forEach((cell, idx) => {
            const h = colHeaders[idx] || `COL_${idx}`;
            const val = cell ? (cell.f !== undefined && cell.f !== null ? cell.f : (cell.v !== null && cell.v !== undefined ? cell.v : '')) : '';
            rowObj[h] = val;
            rowObj[`idx_${idx}`] = val; // Index key for columns M (12) to Y (24)
          });

          const checkContent = findValue(rowObj, /Thủ Nhãn|C5|WBSID/i) || rowObj['idx_0'] || rowObj['idx_1'];
          if (cleanText(checkContent)) {
            allRows.push(rowObj);
          }
        }

        discoverAllFilters(colHeaders);
        buildDropdown();
        handleFilterSort();

      } catch (err) {
        console.error(err);
        document.getElementById('statusBox').innerHTML = `
          <p style="color:#ef5350; font-weight:700;">Không thể tải dữ liệu từ Google Sheet</p>
          <p style="font-size:0.85rem; margin-top:8px;">Vui lòng kiểm tra quyền chia sẻ công khai của file.</p>
        `;
      }
    }

    // 2. Discover all 13 STT sequence columns (Columns M to Y / 12 to 24)
    function discoverAllFilters(headersList) {
      filterOptions = [];
      const seenKeys = new Set();

      for (let i = 12; i <= 24; i++) {
        const colLetter = String.fromCharCode(65 + i);
        const headerName = headersList[i] || '';
        const idxKey = `idx_${i}`;
        const key = (headerName && !headerName.startsWith('COL_')) ? headerName : idxKey;

        const validRows = allRows.filter(r => cleanText(r[key]) !== '' || cleanText(r[idxKey]) !== '');
        
        if (validRows.length > 0 && !seenKeys.has(key)) {
          seenKeys.add(key);
          
          let displayLabel = headerName;
          if (!displayLabel || displayLabel.startsWith('COL_')) {
            displayLabel = `STT-${colLetter}`;
          }
          displayLabel = displayLabel.replace(/^(STT[-_ ]*)+/i, 'STT-');

          filterOptions.push({
            key: key,
            idxKey: idxKey,
            label: displayLabel,
            count: validRows.length
          });
        }
      }

      headersList.forEach((h, idx) => {
        if (/^STT[-_ ]/i.test(h) && !seenKeys.has(h) && !/sort|helper/i.test(h)) {
          const count = allRows.filter(r => cleanText(r[h]) !== '').length;
          if (count > 0) {
            seenKeys.add(h);
            filterOptions.push({
              key: h,
              idxKey: `idx_${idx}`,
              label: h,
              count: count
            });
          }
        }
      });
    }

    // 3. Populate dropdown
    function buildDropdown() {
      const select = document.getElementById('sttSelect');
      select.innerHTML = '';

      const allOpt = document.createElement('option');
      allOpt.value = '__ALL__';
      allOpt.textContent = `📋 Xem tất cả (${allRows.length} thẻ)`;
      select.appendChild(allOpt);

      filterOptions.forEach(opt => {
        const el = document.createElement('option');
        el.value = opt.key;
        el.textContent = `🎯 ${opt.label} (${opt.count} thẻ)`;
        select.appendChild(el);
      });

      if (filterOptions.length > 0) {
        select.value = filterOptions[0].key;
      }
    }

    // 4. Filter, Sort, and Render
    function handleFilterSort() {
      const selectedKey = document.getElementById('sttSelect').value || '__ALL__';
      const searchVal = document.getElementById('searchInput').value.trim().toLowerCase();
      const grid = document.getElementById('cardsGrid');

      let list = [];

      if (selectedKey === '__ALL__') {
        list = [...allRows];
      } else {
        const optMeta = filterOptions.find(o => o.key === selectedKey);
        const idxKey = optMeta ? optMeta.idxKey : selectedKey;

        list = allRows
          .filter(r => cleanText(r[selectedKey]) !== '' || cleanText(r[idxKey]) !== '')
          .sort((a, b) => {
            const valA = cleanText(a[selectedKey]) || cleanText(a[idxKey]);
            const valB = cleanText(b[selectedKey]) || cleanText(b[idxKey]);
            return naturalCompare(valA, valB);
          });
      }

      if (searchVal) {
        list = list.filter(r => {
          const combined = Object.values(r).join(' ').toLowerCase();
          return combined.includes(searchVal);
        });
      }

      document.getElementById('counterPill').textContent = `${list.length} / ${allRows.length}`;

      if (list.length === 0) {
        grid.innerHTML = `<div class="status-box">Không tìm thấy thẻ nào phù hợp.</div>`;
        return;
      }

      grid.innerHTML = list.map(row => {
        // 1. Top Pill: WBSID - A1 Sự
        const wbsid = findValue(row, /^WBSID$/i) || row['idx_0'] || '';
        const a1Su = findValue(row, /^A1\s*Sự/i) || findValue(row, /Sự/i);
        
        let comboText = '';
        if (cleanText(wbsid) && cleanText(a1Su)) comboText = `${cleanText(wbsid)} – ${cleanText(a1Su)}`;
        else if (cleanText(wbsid)) comboText = cleanText(wbsid);
        else if (cleanText(a1Su)) comboText = cleanText(a1Su);

        // 2. A2 Lý (Under pill)
        const a2Ly = findValue(row, /^A2\s*Lý/i) || findValue(row, /A2/i);

        // 3. Title components
        const c5Name = findValue(row, /C5.*Thủ Nhãn.*Tên/i) || findValue(row, /C5.*Tên/i) || findValue(row, /Thủ Nhãn.*Tên/i);
        const c1 = findValue(row, /C1.*Tên.*CTT/i) || findValue(row, /C1.*Tên/i);
        const c4Siddham = findValue(row, /C4.*Siddham.*Unicode/i) || findValue(row, /Siddham/i);

        // 4. Dharma Name, CTT Dài, Giảng Giải
        const dharma = findValue(row, /Dharma Object/i) || findValue(row, /C5.*Object/i);
        const c2Dai = findValue(row, /C2.*Tên Dài/i) || findValue(row, /C2/i);
        const c3Giai = findValue(row, /C3.*Giảng Giải/i) || findValue(row, /C3/i);

        // 5. Images (Left: C4 CTT Link | Right: C6 Pháp Bảo Link)
        const imgLeft = getDriveDirectImageUrl(findValue(row, /C4.*CTT.*Link/i) || findValue(row, /CTT.*Link/i));
        const imgRight = getDriveDirectImageUrl(findValue(row, /C6.*Pháp Bảo.*Link/i) || findValue(row, /C6/i) || findValue(row, /Pháp Bảo.*Link/i));

        // 6. Lesser emphasis: A3 Khai Dẫn, A5 Trung Dẫn, A9 Kết Dẫn
        const a3KhaiDan = findValue(row, /A3.*Khai Dẫn/i);
        const a5TrungDan = findValue(row, /A5.*Trung Dẫn/i);
        const a9KetDan = findValue(row, /A9.*Kết Dẫn/i);

        // 7. High emphasis: A4 Hành, A4 Hành A/B, Audio Player, A6 Chú KD, A8 Lời KĐ
        const a4Hanh = findValue(row, /^A4\s*Hành$/i);
        const a4HanhA = findValue(row, /A4.*Hành\s*A/i) || findValue(row, /Hành\s*A/i);
        const a4HanhB = findValue(row, /A4.*Hành\s*B/i) || findValue(row, /Hành\s*B/i);

        // Audio Stream from D1 Audio Link
        const rawAudio = findValue(row, /D1.*Audio.*Link/i) || findValue(row, /Audio.*Link/i) || findValue(row, /D1.*Voice/i);
        const audioSrc = getDriveDirectAudioUrl(rawAudio);

        const a6ChuKD = findValue(row, /A6.*Chú Khởi Động/i);
        const a8LoiKD = findValue(row, /A8.*Lời Khẳng Định/i);

        return `
          <div class="card">
            
            <!-- Full Width Centered Top Pill: WBSID - A1 Sự -->
            ${comboText ? `<div class="full-width-pill">${comboText}</div>` : ''}

            <!-- Smaller text A2 Lý directly under pill -->
            ${a2Ly ? `<p class="top-ly">${a2Ly}</p>` : ''}

            <!-- Main Heading: Thủ Nhãn + CTT + Siddham -->
            ${(c5Name || c1 || c4Siddham) ? `
              <p class="card-label">
                ${c5Name ? `<span class="tên">${c5Name}</span>` : ''}
                ${(c5Name && c1) ? `<span class="separator">–</span>` : ''}
                ${c1 ? `<span class="CTT">${c1}</span>` : ''}
                ${c4Siddham ? `<span class="siddham">${c4Siddham}</span>` : ''}
              </p>
            ` : ''}

            <!-- Dharma Object Name -->
            ${dharma ? `<p class="name">${dharma}</p>` : ''}

            <!-- CTT Dài -->
            ${c2Dai ? `<p class="CTT-dai">${c2Dai}</p>` : ''}

            <!-- Giảng Giải CTT -->
            ${c3Giai ? `<p class="chu-thich">${c3Giai}</p>` : ''}

            <!-- Dual Images (Left: C4 CTT Link | Right: C6 Pháp Bảo Link) -->
            ${(imgLeft || imgRight) ? `
              <div class="image-container">
                ${imgLeft ? `<img src="${imgLeft}" class="card-img" alt="CTT" loading="lazy" onerror="this.style.display='none'"/>` : ''}
                ${imgRight ? `<img src="${imgRight}" class="card-img" alt="Pháp Bảo" loading="lazy" onerror="this.style.display='none'"/>` : ''}
              </div>
            ` : ''}

            <!-- A3 Khai Dẫn (Lesser emphasis) -->
            ${a3KhaiDan ? `<p class="lesser-dan">${a3KhaiDan}</p>` : ''}

            <!-- A4 Hành Header (High emphasis) -->
            ${a4Hanh ? `<h5 class="chu-header">${a4Hanh}</h5>` : ''}

            <!-- A4 Hành A & B (High emphasis) -->
            ${(a4HanhA || a4HanhB) ? `
              <div class="data-container">
                ${a4HanhA ? `<div class="chu-col">${a4HanhA}</div>` : ''}
                ${a4HanhB ? `<div class="chu-col">${a4HanhB}</div>` : ''}
              </div>
            ` : ''}

            <!-- Built-in Google Drive Audio Player (D1 Audio Link) -->
            ${audioSrc ? `
              <div class="audio-wrapper">
                <audio controls class="audio-player" preload="none">
                  <source src="${audioSrc}" type="audio/mpeg">
                  <source src="${audioSrc}" type="audio/mp4">
                  Trình duyệt không hỗ trợ phát âm thanh.
                </audio>
              </div>
            ` : ''}

            <!-- A5 Trung Dẫn (Lesser emphasis) -->
            ${a5TrungDan ? `<p class="lesser-dan">${a5TrungDan}</p>` : ''}

            <!-- A6 Chú Khởi Động (High emphasis) -->
            ${a6ChuKD ? `<p class="chu-KD-bold">${a6ChuKD}</p>` : ''}

            <!-- A8 Lời Khẳng Định (High emphasis) -->
            ${a8LoiKD ? `<p class="KD-bold">${a8LoiKD}</p>` : ''}

            <!-- A9 Kết Dẫn (Lesser emphasis) -->
            ${a9KetDan ? `<p class="lesser-dan">${a9KetDan}</p>` : ''}

          </div>
        `;
      }).join('');
    }

    window.addEventListener('DOMContentLoaded', initSheetData);
  </script>
</body>
</html>
